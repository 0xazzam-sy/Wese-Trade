# Builds the desktop app on Windows and macOS from the same source, INSTALLS it and runs
# the automated smoke test on the installed app (no Python/Node on PATH):
#   first launch -> first admin + forward-test run; second launch -> same user, same run;
#   graceful backend stop and no orphan process after each launch; crash recovery; offline.
# Unsigned, no updater artifacts: this is validation, not a release (see release.yml).
name: Desktop build & validation

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/build_sidecar.py"
      - "scripts/desktop_smoke.py"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths: ["desktop/**", "backend/**", "frontend/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
          - name: macOS Apple Silicon
            os: macos-14
            bundles: app,dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build backend sidecar (PyInstaller) + frontend, then self-test it
        shell: bash
        run: |
          python -m pip install -r backend/requirements-build.txt
          python scripts/build_sidecar.py

      - name: Build desktop app (unsigned validation build)
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Install (Windows, per-user, silent) and locate the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Wese Trade", "$env:LOCALAPPDATA\Programs" -Recurse -Filter wese-trade.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Depth 3 -Filter wese-trade.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw "installed wese-trade.exe not found" }
          Write-Host "Installed at $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate the app (macOS .app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(ls -d desktop/src-tauri/target/release/bundle/macos/*.app | head -1)"
          ls -la "$app/Contents/MacOS" "$app/Contents/Resources/backend" | head -20
          echo "APP_EXE=$PWD/$app/Contents/MacOS/wese-trade" >> "$GITHUB_ENV"
          ls desktop/src-tauri/target/release/bundle/dmg/

      - name: Smoke test the installed app (real app-data dir, no Python/Node on PATH)
        shell: bash
        run: python scripts/desktop_smoke.py "$APP_EXE"

      - name: Smoke test offline startup + crash recovery (separate data root)
        shell: bash
        env:
          WESE_RUNTIME_ROOT: ${{ runner.temp }}/wese offline/مستخدم/WeseTrade
        run: python scripts/desktop_smoke.py "$APP_EXE" --offline --crash

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          mkdir -p smoke-logs
          for d in "$LOCALAPPDATA/WeseTrade/logs" "$HOME/Library/Application Support/WeseTrade/logs" "$RUNNER_TEMP/wese offline"; do
            [ -d "$d" ] && cp -R "$d" "smoke-logs/$(echo "$d" | tr '/: ' '___')" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wese-trade-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            smoke-logs/
          if-no-files-found: warn
          retention-days: 14
