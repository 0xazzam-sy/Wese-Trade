[package]
name = "wese-trade-desktop"
version = "1.0.1"
description = "Wese Trade desktop shell: runs the packaged local backend and shows the app"
authors = ["Wese Trade"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "wese_trade_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
