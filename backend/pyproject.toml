[project]
name = "neuralshot-backend"
version = "0.1.0"
description = "NeuralShot — local-first crypto futures market analysis backend (analysis only, no trading)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "S",    # bandit (security)
  "ASYNC",
  "RUF",
  "SIM",
  "PT",
]
ignore = [
  "B008", # FastAPI dependency injection uses calls in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018", "ASYNC109", "ASYNC110", "SLF001"]
"alembic/**" = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^data/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
# Live BingX tests hit the real public API; run explicitly with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real BingX public API (network required, no API keys)"]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  # Starlette's TestClient (used only for WebSocket tests) nudges towards httpx2.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
